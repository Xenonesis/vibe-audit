name: release-gate
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python scripts/release_gate.py .
      - run: python scripts/package_release.py . --output dist/vibe-coding-polisher-${{ github.ref_name }}.zip
      - run: |
          echo 'Publish only after behavioral compatibility evidence is reviewed.'
          echo 'This workflow intentionally does not expose release credentials or auto-publish artifacts.'
